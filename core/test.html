<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="uploadForm">
        <!-- <input type="file" name="image" accept="image/*" > -->
        <!-- <input type="text" name="answerId"> -->
        <input type="text" name="postId" placeholder="post">
        <input type="number" name="value" placeholder="">
        <button type="submit">Submit</button>
    </form>
</body>

</html>


<script>
    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        console.log(Object.fromEntries(formData));

        try {
            const response = await fetch('http://404devs/core/Application.php?action=Views', {
                method: 'POST',
                body: formData
            });

            const result = await response.text();
            console.log('Ответ:', result);
        } catch (error) {
            console.error('трабл с CORS:', error);
        }
    };
</script>
