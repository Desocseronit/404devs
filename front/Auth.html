<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .auth-form{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            justify-content: center;
            
        }
        .auth{
            display: flex;
            margin-top: 10px;
            justify-content: center;
        }
        .a *{
            color: aquamarine;
        }
    </style>
</head>
<body>
    <header>

    </header>
    <main>
        <form method="POST" >
            <div class="auth-form">
                <div class="login">
                    <input type="text" id="username" name="username" placeholder="Логин">
                </div>
                <div class="password">
                    <input type="password" id="password" name="password" placeholder="Пароль">
                </div>
            </div>
            <div class="auth">
                <button id="auth" type="submit">Вход</button>
            </div>
            <p class="message"></p>
        </form>      
    </main>
    <footer>

    </footer>
</body>
<script>
    
    
    document.querySelector('form').addEventListener('submit',e=>{
        e.preventDefault()
        let formData = new FormData(e.target)
         fetch('http://404devs/core/Application.php?action=AuthUser',{
            method:'POST',
            body: formData
        })
        .then(resp=>{
            if(resp.status == 200){
               return resp.json().then(data=>{
                window.location.href()
               }) 
            }
            else{
                document.querySelector('.message').innerText = 'Логин или пароль неверен'
            }
        })
    })
</script>
</html>
